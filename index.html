<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Weighment Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Admin Button (Bottom Right) -->
    <button onclick="openAdminPanel()" class="admin-btn">⚙️</button>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="container">
        <h2>Weighment Login</h2>
        
        <!-- Optional: Email Link Login -->
        <div class="auth-box">
            <input type="email" id="email" placeholder="Enter Email (Optional)">
            <button id="sendLinkBtn" class="secondary-btn">Send Email Link</button>
        </div>
        
        <hr>

        <!-- Secure PIN Login (Main) -->
        <div class="auth-box">
            <input type="password" id="pin" placeholder="Enter 4-Digit PIN" maxlength="4">
            <button id="pinBtn" class="primary-btn">Login with PIN</button>
        </div>
        
        <p id="loginMessage" class="error-msg"></p>
    </div>

    <!-- 2. MAIN CALCULATOR SCREEN (Hidden by default) -->
    <div id="calculatorScreen" class="container hide">
        <h2>Weighment Calculator</h2>
        
        <div class="calc-row">
            <label>SKU 1 Weight:</label>
            <input type="number" id="sku1" placeholder="Weight">
        </div>
        <div class="calc-row">
            <label>SKU 1 Bags:</label>
            <input type="number" id="bags1" placeholder="Qty">
        </div>
        
        <hr>

        <div class="calc-row">
            <label>SKU 2 Weight:</label>
            <input type="number" id="sku2" placeholder="Weight">
        </div>
        <div class="calc-row">
            <label>SKU 2 Bags:</label>
            <input type="number" id="bags2" placeholder="Qty">
        </div>

        <div class="results">
            <h3>Total Bags: <span id="totalBags" style="color: #007bff;">0</span></h3>
            <h3>Total Weight: <span id="totalWeight" style="color: #28a745;">0.000 KG</span></h3>
        </div>

        <button id="resetBtn" class="danger-btn">Reset Values</button>
        <button onclick="location.reload()" class="logout-btn">Logout</button>
    </div>

    <!-- 3. ADMIN PANEL MODAL (Hidden by default) -->
    <div id="adminModal" class="modal hide">
        <div class="modal-content">
            <span onclick="closeAdminPanel()" class="close-btn">&times;</span>
            <h2>Admin Dashboard</h2>
            
            <div class="add-user-section">
                <input type="text" id="newUserName" placeholder="Enter User Name">
                <input type="number" id="newUserPin" placeholder="4-Digit PIN">
                <button onclick="addNewUser()" class="primary-btn">Add User</button>
            </div>

            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>PIN</th>
                            <th>Status</th>
                            <th>Device</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersListBody">
                        <!-- Firebase se Data Yahan Aayega -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Type module zaroori hai -->
    <script type="module" src="app.js"></script>
</body>
</html>
